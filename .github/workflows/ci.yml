name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: ShellCheck and browser-client syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y shellcheck
      - run: shellcheck apps/demo/foafmixer/*.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check every browser-client module
        run: |
          status=0
          while IFS= read -r f; do
            node --input-type=module --check < "$f" || { echo "syntax error in $f"; status=1; }
          done < <(find apps/demo/foafmixer/web/js -name '*.js' | sort)
          exit $status
      - name: No machine-specific tailnet hostname in the tree
        run: |
          if grep -rn 'ts\.net' --exclude-dir=.git . ; then
            echo "tailnet hostnames must not be committed; scripts derive them at runtime"; exit 1
          fi
