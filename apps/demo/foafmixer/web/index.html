<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Foafmixer</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231d7558'/%3E%3Cpath d='M16 18h32v8H24v8h20v8H24v12h-8z' fill='white'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/strophe.js/dist/strophe.umd.min.js"></script>
    <script defer src="/app.js"></script>
  </head>
  <body>
    <main>
      <header>
        <h1>Foafmixer</h1>
        <p>Private XMPP MIX pilot · human accounts and accountable bots</p>
      </header>

      <section class="card" id="connection-card">
        <h2>Sign in</h2>
        <form id="login-form">
          <label>JID <input id="jid" type="text" autocomplete="username" placeholder="alice@foafmixer.test" autofocus required></label>
          <label>Password <input id="password" type="password" autocomplete="current-password" required></label>
          <label>WebSocket server <input id="websocket-host" type="text" autocomplete="off" required></label>
          <label>WebSocket endpoint
            <select id="websocket-port" required>
              <option value="8444">Live pilot — port 8444</option>
              <option value="15281">Patched MIX test — port 15281</option>
            </select>
          </label>
          <label class="session-option"><input id="remember-session" type="checkbox" checked> Keep this tab signed in for 20 minutes of inactivity</label>
          <button type="submit">Connect</button>
          <button id="disconnect" type="button" disabled>Disconnect</button>
        </form>
        <p id="connection-status" role="status">Disconnected</p>
      </section>

      <section class="card" id="mix-card">
        <h2>MIX channel</h2>
        <div class="controls">
          <label>Service <input id="service" type="text" value="mix.foafmixer.test"></label>
          <label>Channel <input id="channel" type="text" value="factoidal"></label>
          <label>Nick <input id="nick" type="text" placeholder="Set after sign-in"></label>
          <button id="create-channel" type="button" disabled>Create</button>
          <button id="join-channel" type="button" disabled>Join</button>
        </div>
        <p id="channel-status">Connect, then create or join a channel.</p>
      </section>

      <section class="card" id="chat-card">
        <h2 id="chat-title">Messages</h2>
        <ol id="messages" aria-live="polite"></ol>
        <form id="message-form">
          <label class="sr-only" for="message">Message</label>
          <textarea id="message" rows="3" placeholder="Join a channel before sending" disabled></textarea>
          <button id="send" type="submit" disabled>Send</button>
        </form>
      </section>

      <details class="card">
        <summary>Protocol log</summary>
        <pre id="protocol-log"></pre>
      </details>
    </main>
  </body>
</html>
